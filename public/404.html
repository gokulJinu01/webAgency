<!doctype html>

<head>

<title>Page not found — Luko Designs</title>

<style>
:root{color-scheme:light;--bg:#e8ece9;--ink:#263e34;--muted:#56655b;--accent:#56705f;--dark:#315344;--shade:#cbd1cd}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:460px;text-align:center}
h1{font-size:clamp(34px,8vw,54px);line-height:1.08;letter-spacing:-.04em;font-weight:600;margin:0 0 14px}
p{color:var(--muted);margin:0 0 30px}
a.button{display:inline-block;background:var(--dark);color:#fff;text-decoration:none;padding:15px 22px;border-radius:13px;font-size:14px;box-shadow:5px 5px 14px var(--shade),-5px -5px 14px #fff}
a.button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.mail{display:block;margin-top:22px;font-size:14px;color:var(--muted)}
.mail a{color:var(--ink)}
</style>
</head>
